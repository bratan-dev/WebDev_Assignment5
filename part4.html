    <p class="lead">Add tasks, mark them complete, and remove them. Tasks are kept in an array while this page is open.</p>
    <section class="lesson-card todo-card" aria-labelledby="task-eight-title">
      <p class="task-number">Task 8</p>
      <h2 id="task-eight-title">My Tasks</h2>
      <form class="todo-form" id="todo-form">
        <label class="field-label" for="task-input">New task</label>
        <div class="todo-input-row">
          <input class="text-input" id="task-input" type="text" placeholder="For example, review JavaScript events" autocomplete="off" required>

        </div>
      </form>
      <p class="list-message" id="todo-count" aria-live="polite">No tasks yet.</p>
